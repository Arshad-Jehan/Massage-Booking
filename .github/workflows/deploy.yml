name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Values may be saved as repository Secrets or Variables; either works.
      - name: Check Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository secrets (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          url="$(echo "$VITE_SUPABASE_URL" | tr -d '[:space:]')"
          case "$url" in
            *.supabase.co|*.supabase.co/|https://*.supabase.co|https://*.supabase.co/) echo "Supabase URL looks valid." ;;
            *) echo "::warning::VITE_SUPABASE_URL doesn't look like https://<project>.supabase.co — double-check it." ;;
          esac
          key_len=$(printf %s "$VITE_SUPABASE_ANON_KEY" | tr -d '[:space:]' | wc -c)
          if [ "$key_len" -lt 30 ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY is too short ($key_len chars) — paste the full anon/publishable key."
            exit 1
          fi
          echo "Supabase key present ($key_len chars)."

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          # Serve the app for deep links like /admin (GitHub Pages has no SPA rewrites).
          cp dist/index.html dist/404.html
          # Public pages get a real file so they load with a 200 status.
          mkdir -p dist/pricing && cp dist/index.html dist/pricing/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
